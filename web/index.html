<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Antigravity Mission Board</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230F172A'/%3E%3Cpath d='M8 22L16 8l8 14h-4.2L16 15.2 12.2 22H8z' fill='%2338BDF8'/%3E%3Ccircle cx='16' cy='21' r='2.3' fill='%2310B981'/%3E%3C/svg%3E"
    />
    <script>
      (function () {
        try {
          const saved = localStorage.getItem('agmb_theme');
          const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          const theme = saved === 'light' || saved === 'dark' ? saved : (prefersDark ? 'dark' : 'light');
          if (theme === 'dark') document.documentElement.classList.add('dark');
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="bg-[#F7F8FA] text-zinc-900 antialiased selection:bg-sky-500/20 selection:text-sky-900 dark:bg-[#0B0D11] dark:text-zinc-100 dark:selection:bg-sky-400/25 dark:selection:text-sky-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
