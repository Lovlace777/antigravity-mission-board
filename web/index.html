<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Antigravity Mission Board</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        try {
          const params = new URLSearchParams(window.location.search);
          if (params.get('mode') === 'widget') {
            document.documentElement.classList.add('widget-mode');
          }
          const saved = localStorage.getItem('agmb_theme');
          const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          const theme = saved === 'light' || saved === 'dark' ? saved : (prefersDark ? 'dark' : 'light');
          if (theme === 'dark') document.documentElement.classList.add('dark');
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="bg-[#F6F5F1] text-[#1C1917] antialiased selection:bg-[#1C1917]/15 selection:text-[#1C1917] dark:bg-[#111110] dark:text-[#F2F1EE] dark:selection:bg-[#F2F1EE]/20 dark:selection:text-[#F2F1EE]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
